name: Frontend CI

on:
  push:
    branches:
      - main
      - initial-design
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
- name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
